name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '10'
            testbench: '^8.0'
            php: '8.2'
          - laravel: '11'
            testbench: '^9.0'
            php: '8.2'
          - laravel: '12'
            testbench: '^10.0'
            php: '8.2'
          - laravel: '13'
            testbench: '^11.0'
            php: '8.3'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          coverage: none

      - name: Resolve the Laravel test matrix
        run: |
          composer require --dev --no-update "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}"
          composer config audit.block-insecure false
          composer update --with-all-dependencies --prefer-dist --no-interaction

      - name: Validate package metadata
        run: composer validate --strict

      - name: Check autoload and syntax
        run: |
          composer dump-autoload --optimize --strict-psr
          composer test:lint

      - name: Run tests
        run: composer test

      - name: Audit supported dependency baseline
        if: matrix.laravel == '13'
        run: composer audit
